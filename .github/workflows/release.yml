name: Build & Deploy (kubectl - Windows Runner)

on:
  push:
    tags:
      - "v*"
      - "ver-*"
      - "version-*"
      - "prod-*"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
    - uses: actions/checkout@v3

    - name: Extract tag
      id: tag
      shell: bash
      run: |
        TAG=${GITHUB_REF#refs/tags/}
        TAG=${TAG#version-}
        TAG=${TAG#ver-}
        TAG=${TAG#v}
        echo "tag=$TAG" >> $GITHUB_OUTPUT

    - name: Login to GHCR
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: doladoli
        password: ${{ secrets.GHCR_PAT }}

    - name: Build & push image
      run: |
        docker build -t ghcr.io/doladoli/app1:${{ steps.tag.outputs.tag }} .
        docker tag ghcr.io/doladoli/app1:${{ steps.tag.outputs.tag }} ghcr.io/doladoli/app1:latest
        docker push ghcr.io/doladoli/app1:${{ steps.tag.outputs.tag }}
        docker push ghcr.io/doladoli/app1:latest

  deploy:
    needs: build
    runs-on: self-hosted  # Windows self-hosted runner

    steps:
    - uses: actions/checkout@v3

    - name: Extract tag (PowerShell)
      id: tag
      shell: pwsh
      run: |
        $TAG = $env:GITHUB_REF -replace '^refs/tags/(version-|ver-|v)?', ''
        Write-Output "tag=$TAG" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8

    - name: Login to GHCR
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: doladoli
        password: ${{ secrets.GHCR_PAT }}

    - name: Pull new image (PowerShell)
      shell: powershell
      run: |
        docker pull ghcr.io/doladoli/app1:${{ steps.tag.outputs.tag }}
        docker tag ghcr.io/doladoli/app1:${{ steps.tag.outputs.tag }} ghcr.io/doladoli/app1:latest

    - name: Update Kubernetes deployment (PowerShell)
      shell: powershell
      run: |
        kubectl set image deployment/app1 app1=ghcr.io/doladoli/app1:${{ steps.tag.outputs.tag }} --record
        kubectl rollout status deployment/app1
