name: Build & Deploy (kubectl)

on:
  push:
    tags:
      - "v*"
      - "ver-*"
      - "version-*"
      - "prod-*"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
    - uses: actions/checkout@v3

    - name: Extract tag
      id: tag
      run: |
        TAG=${GITHUB_REF#refs/tags/}
        TAG=${TAG#version-}
        TAG=${TAG#ver-}
        TAG=${TAG#v}
        echo "tag=$TAG" >> $GITHUB_OUTPUT

    - name: Login to GHCR
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: doladoli
        password: ${{ secrets.GHCR_PAT }}

    - name: Build & push image
      run: |
        docker build -t ghcr.io/doladoli/app1:${{ steps.tag.outputs.tag }} .
        docker tag ghcr.io/doladoli/app1:${{ steps.tag.outputs.tag }} ghcr.io/doladoli/app1:latest
        docker push ghcr.io/doladoli/app1:${{ steps.tag.outputs.tag }}
        docker push ghcr.io/doladoli/app1:latest

  deploy:
    needs: build
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v3

    - name: Extract tag
      id: tag
      run: |
        TAG=${GITHUB_REF#refs/tags/}
        TAG=${TAG#version-}
        TAG=${TAG#ver-}
        TAG=${TAG#v}
        echo "tag=$TAG" >> $GITHUB_OUTPUT

    - name: Login to GHCR
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: doladoli
        password: ${{ secrets.GHCR_PAT }}

    - name: Pull new image with tag
      run: |
        docker pull ghcr.io/doladoli/app1:${{ steps.tag.outputs.tag }}
        docker tag ghcr.io/doladoli/app1:${{ steps.tag.outputs.tag }} ghcr.io/doladoli/app1:latest

    - name: Update Kubernetes deployment
      run: |
        kubectl set image deployment/app1 app1=ghcr.io/doladoli/app1:${{ steps.tag.outputs.tag }} --record
        kubectl rollout status deployment/app1
