name: Build & Push Docker Image (Tag)

on:
  push:
    tags:
      - "prod-*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Checkout code
    - name: Checkout code
      uses: actions/checkout@v3

    # 2️⃣ Extract tag name
    - name: Extract version tag
      run: |
        echo "IMAGE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

    # 3️⃣ Setup Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    # 4️⃣ Login to GHCR
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: doladoli
        password: ${{ secrets.GHCR_PAT }}

    # 5️⃣ Build Docker image
    - name: Build Docker image
      run: |
        docker build \
          -t ghcr.io/doladoli/app1:${{ env.IMAGE_TAG }} \
          -t ghcr.io/doladoli/app1:latest \
          .

    # 6️⃣ Push Docker image
    - name: Push Docker image
      run: |
        docker push ghcr.io/doladoli/app1:${{ env.IMAGE_TAG }}
        docker push ghcr.io/doladoli/app1:latest
