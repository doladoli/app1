name: Build & Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_PAT }}

    - name: Get latest tag and increment version
      id: semver
      run: |
        latest_tag=$(git tag --list "version-*" --sort=-v:refname | head -n1)
        if [ -z "$latest_tag" ]; then
          major=0
          minor=0
          patch=0
        else
          IFS='.' read -r major minor patch <<< "${latest_tag#version-}"
        fi

        # Detect type of commit
        commit_message=$(git log -1 --pretty=%B)
        if [[ "$commit_message" =~ BREAKING\ CHANGE ]]; then
          major=$((major + 1))
          minor=0
          patch=0
        elif [[ "$commit_message" =~ ^feat ]]; then
          minor=$((minor + 1))
          patch=0
        else
          patch=$((patch + 1))
        fi

        NEW_TAG="version-${major}.${minor}.${patch}"
        echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV

    - name: Build Docker image
      run: |
        IMAGE=ghcr.io/${{ github.repository_owner }}/app1:${{ env.NEW_TAG }}
        docker build -t $IMAGE .

    - name: Push Docker image
      run: |
        IMAGE=ghcr.io/${{ github.repository_owner }}/app1:${{ env.NEW_TAG }}
        docker push $IMAGE

    - name: Create Git tag
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git tag ${{ env.NEW_TAG }}
        git push origin ${{ env.NEW_TAG }}
