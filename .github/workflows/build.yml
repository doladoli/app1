name: Build & Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Get latest tag
      id: get_tag
      run: |
        latest_tag=$(git tag --list "version-*" --sort=-v:refname | head -n 1)
        echo "Latest tag: $latest_tag"
        if [ -z "$latest_tag" ]; then
          echo "version-0.0.0" >> tag.txt
        else
          echo "$latest_tag" >> tag.txt
        fi
        latest_tag=$(cat tag.txt)
        # increment PATCH
        IFS='.' read -r major minor patch <<< "${latest_tag#version-}"
        patch=$((patch + 1))
        new_tag="version-${major}.${minor}.${patch}"
        echo "New tag: $new_tag"
        echo "NEW_TAG=$new_tag" >> $GITHUB_ENV

    - name: Build Docker image
      run: |
        IMAGE=ghcr.io/${{ github.repository_owner }}/app1:${{ env.NEW_TAG }}
        docker build -t $IMAGE .

    - name: Push Docker image
      run: |
        IMAGE=ghcr.io/${{ github.repository_owner }}/app1:${{ env.NEW_TAG }}
        docker push $IMAGE

    - name: Create Git tag
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git tag ${{ env.NEW_TAG }}
        git push origin ${{ env.NEW_TAG }}
